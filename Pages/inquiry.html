<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry | Bash's Barbershop</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Bash's Barbershop</h1>

        <nav>
            <a href="../index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="price.html">Prices</a>
            <a href="appointment.html">Book Appointment</a>
            <a href="gallery.html">Gallery</a>
            <a href="reviews.html">Reviews</a>
            <a href="inquiry.html">Inquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Make an Inquiry</h2>

            <p>
                Do you have a question about our services, prices
                or appointments? Send us an inquiry and we will
                get back to you.
            </p>
        </section>

        <section>
            <h2>Inquiry Form</h2>

            <form>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name">

                <br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email">

                <br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">

                <br><br>

                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject">

                <br><br>

                <label for="message">Your Inquiry:</label>
                <br>
                <textarea id="message" name="message" rows="6" cols="30"></textarea>

                <br><br>

                <button type="submit">Submit Inquiry</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Bash's Barbershop. All rights reserved.</p>
    </footer>

</body>
</html>
